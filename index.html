<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMRANI DRAMAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#050505;
 color:white;
 font-family:Arial;
 display:flex;
 flex-direction:column;
 align-items:center;
 min-height:100vh;
 overflow:hidden;
 position:relative;
}
body::before{
 content:"";
 position:absolute;
 width:160%;
 height:4px;
 background:linear-gradient(90deg,transparent,#00ff88,#a020f0,#ffae00,transparent);
 top:35%;
 left:-30%;
 transform:rotate(-18deg);
 box-shadow:0 0 20px #a020f0,0 0 40px #00ff88;
 animation:lightMove 3s infinite linear;
 z-index:1;
}
body::after{
 content:"";
 position:absolute;
 width:160%;
 height:4px;
 background:linear-gradient(90deg,transparent,#ff00ff,#00e5ff,#ffae00,transparent);
 bottom:25%;
 left:-30%;
 transform:rotate(-18deg);
 box-shadow:0 0 20px #ff00ff;
 animation:lightMove2 3.5s infinite linear;
 z-index:1;
}
@keyframes lightMove{
 0%{transform:rotate(-18deg) translateX(-200px)}
 100%{transform:rotate(-18deg) translateX(200px)}
}
@keyframes lightMove2{
 0%{transform:rotate(-18deg) translateX(200px)}
 100%{transform:rotate(-18deg) translateX(-200px)}
}
h1{
 margin-top:90px;
 font-size:30px;
 color:#ffcc00;
 text-shadow:0 0 10px #a020f0,0 0 25px #a020f0;
 z-index:2;
 text-align:center;
 animation:glow 2s infinite alternate;
}
@keyframes glow{
 from{text-shadow:0 0 10px #a020f0}
 to{text-shadow:0 0 20px #ffae00,0 0 30px #a020f0}
}
p{z-index:2;margin-top:12px;animation:fadeIn 2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.btns{z-index:2;margin-top:20px;display:flex;gap:12px}
.btn{
 padding:11px 20px;
 border-radius:25px;
 font-weight:bold;
 border:2px solid;
 background:black;
 text-decoration:none;
 transition:0.3s;
}
.btn:hover{transform:scale(1.1);box-shadow:0 0 20px currentColor}
.btn-pink{color:#ff66ff;border-color:#ff66ff}
.btn-orange{color:#ffae00;border-color:#ffae00}

.card{
 z-index:2;
 margin-top:28px;
 width:290px;
 background:rgba(15,15,15,0.9);
 border:2px solid #a020f0;
 border-radius:22px;
 padding:16px;
 text-align:center;
 box-shadow:0 0 15px #a020f0;
 animation:float 3s infinite ease-in-out;
}
@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-8px)}
}
.avatar{
 width:165px;
 height:165px;
 border-radius:50%;
 margin:0 auto;
 padding:4px;
 background:linear-gradient(#00e5ff,#a020f0,#ffae00);
 animation:rotateBorder 4s linear infinite;
}
@keyframes rotateBorder{
 0%{filter:hue-rotate(0deg)}
 100%{filter:hue-rotate(360deg)}
}
.avatar img{
 width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #111;
}
.name-style{
 margin-top:14px;
 white-space:pre-line;
 line-height:1.5;
}
.name-style span{
 color:#ffcc00;
 font-weight:bold;
 font-size:18px;
 text-shadow:0 0 8px #ffae00;
}
</style>
</head>
<body>

<h1>𓆩༒︎𝐔͢𝐌֟፝𝐑͜𝐀֟፝͡𝐍͢𝐈 𝐃͢𝐑֟፝𝐀͜𝐌֟፝͡𝐀͢𝐒༒︎𓆪</h1>
<p>Open Website and Enjoy DRAMAS 🎭</p>

<div class="btns">
 <a href="Ubaid.html" class="btn btn-pink">Website Owner</a>
 <a href="Movies.html" class="btn btn-orange">Show DRAMAS</a>
</div>

<div class="card">
 <div class="avatar">
  <img src="ubaid.jpg">
 </div>
 <div class="name-style">☆⎯꯭̽ 𓆩❍Ꮿη̽𝛆̽꧊ꝛ͢𓂃𖡼
<span>𓆩༒︎𝐔͢𝐛֟፝𝐚͜𝐢֟፝͡𝐝___𝐁͢𝐚֟፝𝐋͜𝐨֟፝͡𝐜͢𝐡༒︎𓆪</span></div>
</div>

</body>
</html>
